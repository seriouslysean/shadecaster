version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github_actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 6.1 and later wait for typescript-eslint, which (at 8.71.2) only
      # accepts TypeScript below 6.1. Remove this once it supports newer versions.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
